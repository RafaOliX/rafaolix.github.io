services:
  # QA / desarrollo: http://localhost:5173 (hot reload)
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  # Build de producción servido con Nginx: http://localhost:8080
  web:
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
    profiles: ["prod"]

volumes:
  node_modules:
