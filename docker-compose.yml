services:
  # Versión "producción" (igual a lo que va a GitHub Pages)
  web:
    build: .
    ports:
      - "8080:80"
    restart: unless-stopped

  # Modo desarrollo con hot reload: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
